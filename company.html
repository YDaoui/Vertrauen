<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone1.ico" />
  <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone1.ico" />
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body class="dashboard-page">
  <header class="dashboard-header" id="dashboardHeader">
    <!-- Logo à gauche -->
    <a href="index.html" class="logo-link">
      <img src="Images/Vertrauen_Logo1.png" alt="Vertrauen Distributor" />
    </a>

    <!-- Message de bienvenue centré -->
    <span id="userNameDisplay" class="welcome-center"></span>

    <!-- Hamburger (visible sur mobile) -->
    <button class="hamburger" id="hamburgerBtn" aria-label="Menü öffnen/schließen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation -->
    <nav class="dashboard-nav" id="mainNav">
      <!-- Menu pour tous -->
      <a href="dashboard.html">Willkommen</a>
      
      <!-- Lien Statistik pour ADMIN (daoui00yassine@gmail.com) -->
      <a href="stat.html" id="statLink" style="display:none;">Statistik</a>
      
      <!-- Lien Mein Portal pour UTILISATEURS NORMALUX -->
      <a href="mein-portal.html" id="portalLink">Mein Portal</a>
      
      <a href="company.html" class="active">Company</a>
      <a href="ueber-uns.html">Über uns</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <a href="#" id="logoutMobile" style="display:none;">Abmelden</a>
    </nav>

  </header>

  <main class="dashboard-content">
    <div class="company-box">
      <h2>Unsere Partnerunternehmen</h2>
      <p style="margin-bottom:20px;">Hier sehen Sie alle Unternehmen, die bei uns registriert sind.</p>
      <div id="companyListPublic">
        <p style="color:#6a7b91;">Lade Unternehmen...</p>
      </div>
    </div>
  </main>

  <footer class="dashboard-footer">
    <a href="datenschutz.html">Datenschutzerklärung</a>
    <span style="color:#6a7b91; margin:0 12px;">|</span>
    <span style="color:#6a7b91;">© 2026 Vertrauen Distributor Vertriebs GmbH</span>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <!-- main.js (UNIQUE fichier partagé) -->
  <script src="main.js"></script>

  <!-- Script d'initialisation -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const userEmail = localStorage.getItem('userEmail');
      
      const statLink = document.getElementById('statLink');
      const portalLink = document.getElementById('portalLink');
      const adminLink = document.getElementById('adminLink');
      
      if (userEmail === 'daoui00yassine@gmail.com') {
        // ADMIN : afficher Statistik et Admin, cacher Mein Portal
        if (statLink) statLink.style.display = 'inline-block';
        if (portalLink) portalLink.style.display = 'none';
        if (adminLink) adminLink.style.display = 'inline-block';
      } else {
        // UTILISATEUR NORMAL : afficher Mein Portal, cacher Statistik et Admin
        if (statLink) statLink.style.display = 'none';
        if (portalLink) portalLink.style.display = 'inline-block';
        if (adminLink) adminLink.style.display = 'none';
      }
      
      // Mettre à jour le bouton login/logout
      if (typeof updateLoginButton === 'function') {
        updateLoginButton();
      }
      
      // Mettre à jour l'affichage du nom
      if (typeof updateUserDisplay === 'function') {
        updateUserDisplay();
      }
      
      // Initialiser la page company
      if (typeof initCompanyPage === 'function') {
        initCompanyPage();
      }
    });
  </script>
</body>
</html>
