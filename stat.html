<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistik – Vertrauen Distributor</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EV3MLGBFYW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EV3MLGBFYW');
    </script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone.ico" />
    <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone.ico" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .stat-donuts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px 50px;
            margin-bottom: 30px;
        }
        .donut-wrapper {
            text-align: center;
            max-width: 180px;
            flex: 1 0 140px;
        }
        .donut-wrapper .label {
            font-weight: 600;
            font-size: 1rem;
            margin-top: 10px;
            color: #ffffff;
        }
        .donut-wrapper .number {
            font-size: 1.6rem;
            font-weight: 700;
            color: #54e50d;
            margin-top: 2px;
        }
        .donut-wrapper canvas {
            max-width: 140px;
            max-height: 140px;
            display: block;
            margin: 0 auto;
        }
        .stat-box {
            background-color: #243957;
            border: 2px solid #54e50d;
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .stat-box:hover {
            border-color: #6a7b91;
            box-shadow: 0 6px 30px rgba(84, 229, 13, 0.15);
        }
        .stat-box h2 {
            color: #54e50d;
            border-bottom: 2px solid #97a3b3;
            padding-bottom: 12px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 1.8rem;
        }
        .stat-box p {
            color: #ffffff;
        }

        /* ============================================================
           HEADER HOMOGENE AVEC EFFET DE SCROLL (comme company.html)
           ============================================================ */
        .dashboard-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 40px;
            background-color: #0c2545;
            border-bottom: 3px solid #54e50d;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            transition: all 0.4s ease;
        }

        /* Header scrolled - fond transparent avec flou */
        .dashboard-header.scrolled {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 3px solid #97a3b3;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }

        /* Logo normal */
        .dashboard-header .logo-link {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .dashboard-header .logo-link img {
            max-height: 50px;
            width: auto;
            display: block;
            filter: brightness(0) invert(1);
            transition: filter 0.4s ease;
        }

        /* Logo scrolled - devient sombre */
        .dashboard-header.scrolled .logo-link img {
            filter: brightness(0) invert(0);
        }

        .welcome-center {
            flex: 1;
            text-align: center;
            font-weight: 500;
            font-size: 1rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 8px;
            transition: color 0.4s ease;
        }
        .welcome-center .welcome-text {
            color: #54e50d;
            font-weight: 600;
        }
        .welcome-center .welcome-name {
            color: #ffffff;
            font-weight: 500;
        }

        /* Texte bienvenue scrolled - devient sombre */
        .dashboard-header.scrolled .welcome-center {
            color: #0c2545;
        }
        .dashboard-header.scrolled .welcome-center .welcome-name {
            color: #0c2545;
        }

        .dashboard-nav {
            display: flex;
            gap: 28px;
            font-weight: 500;
            font-size: 1.05rem;
            flex-wrap: wrap;
            position: relative;
        }
        .dashboard-nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 6px 0 10px 0;
            position: relative;
            transition: color 0.25s ease;
        }
        .dashboard-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 3px;
            background-color: #97a3b3;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .dashboard-nav a:hover {
            color: #54e50d;
        }
        .dashboard-nav a:hover::after {
            transform: scaleX(1);
        }
        .dashboard-nav a.active {
            color: #54e50d;
        }
        .dashboard-nav a.active::after {
            transform: scaleX(1);
        }

        /* Liens scrolled - deviennent sombres */
        .dashboard-header.scrolled .dashboard-nav a {
            color: #0c2545;
        }
        .dashboard-header.scrolled .dashboard-nav a:hover,
        .dashboard-header.scrolled .dashboard-nav a.active {
            color: #54e50d;
        }
        .dashboard-header.scrolled .dashboard-nav a::after {
            background-color: #97a3b3;
        }

        /* BOUTON LOGIN */
        .dashboard-header .login-btn {
            background-color: #54e50d;
            color: #0c2545 !important;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .dashboard-header .login-btn:hover {
            background-color: #6a7b91;
            color: #ffffff !important;
        }

        /* Bouton login scrolled */
        .dashboard-header.scrolled .login-btn {
            background-color: #0c2545;
            color: #ffffff !important;
        }
        .dashboard-header.scrolled .login-btn:hover {
            background-color: #54e50d;
            color: #0c2545 !important;
        }

        /* ---------- CONTENU PRINCIPAL ---------- */
        .dashboard-content {
            flex: 1;
            max-width: 1200px;
            margin: 100px auto 40px;
            padding: 0 40px 60px;
            width: 100%;
        }

        /* ---------- FOOTER ---------- */
        .dashboard-footer {
            background-color: #f0f0f0;
            padding: 20px 40px;
            text-align: center;
            border-top: 1px solid #ddd;
            font-size: 0.95rem;
            margin-top: auto;
        }
        .dashboard-footer a {
            color: #0c2545;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .dashboard-footer a:hover {
            color: #54e50d;
            text-decoration: underline;
        }

        /* --- Hamburger --- */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.4s ease;
        }

        /* Hamburger scrolled - devient sombre */
        .dashboard-header.scrolled .hamburger span {
            background-color: #0c2545;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Responsive */
        @media (max-width: 700px) {
            .stat-donuts {
                gap: 20px 30px;
            }
            .donut-wrapper canvas {
                max-width: 110px;
                max-height: 110px;
            }
            .donut-wrapper .number {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 450px) {
            .stat-box {
                padding: 20px;
            }
            .donut-wrapper canvas {
                max-width: 90px;
                max-height: 90px;
            }
            .donut-wrapper .label {
                font-size: 0.85rem;
            }
        }

        /* ---------- RESPONSIVE : mobile ---------- */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .dashboard-header {
                padding: 10px 16px;
                flex-wrap: nowrap;
            }
            .dashboard-header .logo-link img {
                max-height: 35px;
            }

            .dashboard-nav {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: #0c2545;
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                gap: 16px;
                border-bottom: 3px solid #97a3b3;
                box-shadow: 0 8px 16px rgba(0,0,0,0.3);
                transform: translateY(-120%);
                transition: transform 0.3s ease;
                z-index: 999;
                display: flex;
                margin: 0;
            }
            .dashboard-nav.open {
                transform: translateY(0);
            }
            .dashboard-nav a {
                padding: 8px 0;
                border-bottom: none;
                color: #ffffff;
            }
            .dashboard-nav a::after {
                display: none;
            }
            .dashboard-nav a:hover,
            .dashboard-nav a.active {
                color: #54e50d;
            }

            /* Menu mobile scrolled */
            .dashboard-header.scrolled .dashboard-nav {
                background-color: rgba(255, 255, 255, 0.95);
                border-bottom-color: #97a3b3;
            }
            .dashboard-header.scrolled .dashboard-nav a {
                color: #0c2545;
            }
            .dashboard-header.scrolled .dashboard-nav a:hover,
            .dashboard-header.scrolled .dashboard-nav a.active {
                color: #54e50d;
            }

            .dashboard-nav .login-btn-mobile {
                display: block !important;
                background-color: #54e50d;
                color: #0c2545 !important;
                padding: 8px 28px;
                border-radius: 30px;
                font-weight: 600;
                text-decoration: none;
                margin-top: 8px;
            }
            .dashboard-nav .login-btn-mobile:hover {
                background-color: #6a7b91;
                color: #ffffff !important;
            }

            .dashboard-header.scrolled .dashboard-nav .login-btn-mobile {
                background-color: #0c2545;
                color: #ffffff !important;
            }
            .dashboard-header.scrolled .dashboard-nav .login-btn-mobile:hover {
                background-color: #54e50d;
                color: #0c2545 !important;
            }

            .dashboard-header .login-btn {
                display: none !important;
            }

            .welcome-center {
                order: 3;
                width: 100%;
                text-align: center;
                margin-top: 6px;
                font-size: 0.9rem;
                white-space: normal;
            }

            .dashboard-content {
                padding: 0 20px 40px;
                margin-top: 80px;
            }
            .stat-box {
                padding: 20px;
            }
            .stat-box h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body class="dashboard-page">
    <header class="dashboard-header" id="dashboardHeader">
        <!-- Logo à gauche -->
        <a href="index.html" class="logo-link">
            <img src="Images/Vertrauen_Logo.png" alt="Vertrauen Distributor" />
        </a>

        <!-- Message de bienvenue centré -->
        <span id="userNameDisplay" class="welcome-center"></span>

        <!-- Hamburger (visible sur mobile) -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Menü öffnen/schließen">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation (masquée sur mobile, affichée en desktop) -->
        <nav class="dashboard-nav" id="mainNav">
            <a href="dashboard.html">Willkommen</a>
            <a href="stat.html" class="active">Statistik</a>
            <a href="company.html">Company</a>
            <a href="ueber-uns.html">Über uns</a>
            <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
            <!-- ⬇️ Lien de déconnexion pour mobile (caché sur desktop) -->
            <a href="#" id="logoutMobile" style="display:none;">Abmelden</a>
        </nav>

        <!-- Bouton Login / Abmelden (à droite) -->
        <a href="login.html" class="login-btn">Login</a>
    </header>

    <main class="dashboard-content">
        <div class="stat-box">
            <h2>Übersicht</h2>

            <div class="stat-donuts">
                <!-- 1. Vertrauensvolle Kunden -->
                <div class="donut-wrapper">
                    <canvas id="emailDonut"></canvas>
                    <div class="label">Unsere vertrauensvollen Kunden</div>
                    <div class="number" id="emailCount">0</div>
                </div>
                <!-- 2. Unternehmen -->
                <div class="donut-wrapper">
                    <canvas id="companyDonut"></canvas>
                    <div class="label">Unternehmen</div>
                    <div class="number" id="companyCount">0</div>
                </div>
                <!-- 3. Stromvertrag -->
                <div class="donut-wrapper">
                    <canvas id="stromDonut"></canvas>
                    <div class="label">Stromvertrag</div>
                    <div class="number" id="stromCount">0</div>
                </div>
                <!-- 4. Gasvertrag -->
                <div class="donut-wrapper">
                    <canvas id="gasDonut"></canvas>
                    <div class="label">Gasvertrag</div>
                    <div class="number" id="gasCount">0</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="dashboard-footer">
        <a href="datenschutz.html">Datenschutzerklärung</a>
        <span style="color:#6a7b91; margin:0 12px;">|</span>
        <span style="color:#6a7b91;">© 2026 Vertrauen Distributor Vertriebs GmbH</span>
    </footer>

    <script>
        // ===== EFFET DE SCROLL SUR LE HEADER =====
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.getElementById('dashboardHeader');

            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });

        // ===== HAMBURGER MENU =====
        document.addEventListener('DOMContentLoaded', function() {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const mainNav = document.getElementById('mainNav');

            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    mainNav.classList.toggle('open');
                });
            }
        });

        // Afficher le lien Admin si l'utilisateur est admin
        if (localStorage.getItem('isAdmin') === 'true') {
            document.getElementById('adminLink').style.display = 'inline-block';
        }
    </script>

    <script>
        function initStats() {
            if (typeof firebase === 'undefined' || !firebase.apps.length) {
                console.warn('Firebase nicht initialisiert. Warte...');
                setTimeout(initStats, 500);
                return;
            }
            const db = firebase.firestore();

            let emailChart = null,
                companyChart = null,
                stromChart = null,
                gasChart = null;

            async function loadStats() {
                try {
                    const [usersSnap, companiesSnap] = await Promise.all([
                        db.collection('users').get(),
                        db.collection('companies').get()
                    ]);
                    const totalUsers = usersSnap.size;
                    const totalCompanies = companiesSnap.size;
                    // Pour les contrats, on n'a pas encore de données => 0
                    const totalStrom = 0;
                    const totalGas = 0;

                    document.getElementById('emailCount').textContent = totalUsers;
                    document.getElementById('companyCount').textContent = totalCompanies;
                    document.getElementById('stromCount').textContent = totalStrom;
                    document.getElementById('gasCount').textContent = totalGas;

                    updateDonut('emailDonut', totalUsers, '#54e50d', '#6a7b91');
                    updateDonut('companyDonut', totalCompanies, '#54e50d', '#6a7b91');
                    updateDonut('stromDonut', totalStrom, '#54e50d', '#6a7b91');
                    updateDonut('gasDonut', totalGas, '#54e50d', '#6a7b91');
                } catch (error) {
                    console.error('Fehler beim Laden der Statistiken:', error);
                    document.getElementById('emailCount').textContent = '❌';
                    document.getElementById('companyCount').textContent = '❌';
                    document.getElementById('stromCount').textContent = '❌';
                    document.getElementById('gasCount').textContent = '❌';
                }
            }

            function updateDonut(canvasId, value, color, bgColor) {
                const ctx = document.getElementById(canvasId).getContext('2d');
                // Détruire le graphique précédent
                if (canvasId === 'emailDonut' && emailChart) { emailChart.destroy(); }
                else if (canvasId === 'companyDonut' && companyChart) { companyChart.destroy(); }
                else if (canvasId === 'stromDonut' && stromChart) { stromChart.destroy(); }
                else if (canvasId === 'gasDonut' && gasChart) { gasChart.destroy(); }

                const displayValue = Math.min(value, 100);
                const remaining = 100 - displayValue;

                const chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['', ''],
                        datasets: [{
                            data: [displayValue, remaining],
                            backgroundColor: [color, bgColor],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        cutout: '70%',
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: false }
                        }
                    },
                    plugins: [{
                        id: 'centerText',
                        beforeDraw: function(chart) {
                            const { width, height, ctx } = chart;
                            ctx.save();
                            const text = value.toString();
                            ctx.font = 'bold 26px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#ffffff';
                            const centerX = width / 2;
                            const centerY = height / 2;
                            ctx.fillText(text, centerX, centerY);
                            ctx.restore();
                        }
                    }]
                });

                if (canvasId === 'emailDonut') { emailChart = chart; }
                else if (canvasId === 'companyDonut') { companyChart = chart; }
                else if (canvasId === 'stromDonut') { stromChart = chart; }
                else if (canvasId === 'gasDonut') { gasChart = chart; }
            }

            loadStats();
        }

        document.addEventListener('DOMContentLoaded', initStats);
    </script>

    <script src="main.js"></script>
</body>
</html>
