<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistik – Vertrauen Distributor</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EV3MLGBFYW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EV3MLGBFYW');
    </script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone.ico" />
    <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone.ico" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
    <header class="dashboard-header" id="dashboardHeader">
        <!-- Logo à gauche -->
        <a href="index.html" class="logo-link">
            <img src="Images/Vertrauen_Logo1.png" alt="Vertrauen Distributor" />
        </a>

        <!-- Message de bienvenue centré -->
        <span id="userNameDisplay" class="welcome-center"></span>

        <!-- Hamburger (visible sur mobile) -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Menü öffnen/schließen">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation -->
        <nav class="dashboard-nav" id="mainNav">
            <a href="dashboard.html">Willkommen</a>
            <a href="stat.html" class="active">Statistik</a>
            <a href="company.html">Company</a>
            <a href="ueber-uns.html">Über uns</a>
            <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
            <a href="#" id="logoutMobile" style="display:none;">Abmelden</a>
        </nav>

        <!-- Bouton Login / Abmelden -->
        <a href="login.html" class="login-btn">Login</a>
    </header>

    <main class="dashboard-content">
        <div class="stat-box">
            <h2>Übersicht</h2>

            <div class="stat-donuts">
                <!-- 1. Vertrauensvolle Kunden -->
                <div class="donut-wrapper">
                    <canvas id="emailDonut"></canvas>
                    <div class="label">Unsere vertrauensvollen Kunden</div>
                    <div class="number" id="emailCount">0</div>
                </div>
                <!-- 2. Unternehmen -->
                <div class="donut-wrapper">
                    <canvas id="companyDonut"></canvas>
                    <div class="label">Unternehmen</div>
                    <div class="number" id="companyCount">0</div>
                </div>
                <!-- 3. Stromvertrag -->
                <div class="donut-wrapper">
                    <canvas id="stromDonut"></canvas>
                    <div class="label">Stromvertrag</div>
                    <div class="number" id="stromCount">0</div>
                </div>
                <!-- 4. Gasvertrag -->
                <div class="donut-wrapper">
                    <canvas id="gasDonut"></canvas>
                    <div class="label">Gasvertrag</div>
                    <div class="number" id="gasCount">0</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="dashboard-footer">
        <a href="datenschutz.html">Datenschutzerklärung</a>
        <span style="color:#6a7b91; margin:0 12px;">|</span>
        <span style="color:#6a7b91;">© 2026 Vertrauen Distributor Vertriebs GmbH</span>
    </footer>

    <script>
        // ===== EFFET DE SCROLL SUR LE HEADER =====
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.getElementById('dashboardHeader');

            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        });

        // ===== HAMBURGER MENU =====
        document.addEventListener('DOMContentLoaded', function() {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const mainNav = document.getElementById('mainNav');

            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function() {
                    this.classList.toggle('active');
                    mainNav.classList.toggle('open');
                });
            }
        });

        // Afficher le lien Admin si l'utilisateur est admin
        if (localStorage.getItem('isAdmin') === 'true') {
            document.getElementById('adminLink').style.display = 'inline-block';
        }
    </script>

    <script>
        function initStats() {
            if (typeof firebase === 'undefined' || !firebase.apps.length) {
                console.warn('Firebase nicht initialisiert. Warte...');
                setTimeout(initStats, 500);
                return;
            }
            const db = firebase.firestore();

            let emailChart = null,
                companyChart = null,
                stromChart = null,
                gasChart = null;

            async function loadStats() {
                try {
                    const [usersSnap, companiesSnap] = await Promise.all([
                        db.collection('users').get(),
                        db.collection('companies').get()
                    ]);
                    const totalUsers = usersSnap.size;
                    const totalCompanies = companiesSnap.size;
                    // Pour les contrats, on n'a pas encore de données => 0
                    const totalStrom = 0;
                    const totalGas = 0;

                    document.getElementById('emailCount').textContent = totalUsers;
                    document.getElementById('companyCount').textContent = totalCompanies;
                    document.getElementById('stromCount').textContent = totalStrom;
                    document.getElementById('gasCount').textContent = totalGas;

                    updateDonut('emailDonut', totalUsers, '#54e50d', '#6a7b91');
                    updateDonut('companyDonut', totalCompanies, '#54e50d', '#6a7b91');
                    updateDonut('stromDonut', totalStrom, '#54e50d', '#6a7b91');
                    updateDonut('gasDonut', totalGas, '#54e50d', '#6a7b91');
                } catch (error) {
                    console.error('Fehler beim Laden der Statistiken:', error);
                    document.getElementById('emailCount').textContent = '❌';
                    document.getElementById('companyCount').textContent = '❌';
                    document.getElementById('stromCount').textContent = '❌';
                    document.getElementById('gasCount').textContent = '❌';
                }
            }

            function updateDonut(canvasId, value, color, bgColor) {
                const ctx = document.getElementById(canvasId).getContext('2d');
                // Détruire le graphique précédent
                if (canvasId === 'emailDonut' && emailChart) { emailChart.destroy(); }
                else if (canvasId === 'companyDonut' && companyChart) { companyChart.destroy(); }
                else if (canvasId === 'stromDonut' && stromChart) { stromChart.destroy(); }
                else if (canvasId === 'gasDonut' && gasChart) { gasChart.destroy(); }

                const displayValue = Math.min(value, 100);
                const remaining = 100 - displayValue;

                const chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['', ''],
                        datasets: [{
                            data: [displayValue, remaining],
                            backgroundColor: [color, bgColor],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        cutout: '70%',
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: false }
                        }
                    },
                    plugins: [{
                        id: 'centerText',
                        beforeDraw: function(chart) {
                            const { width, height, ctx } = chart;
                            ctx.save();
                            const text = value.toString();
                            ctx.font = 'bold 26px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#ffffff';
                            const centerX = width / 2;
                            const centerY = height / 2;
                            ctx.fillText(text, centerX, centerY);
                            ctx.restore();
                        }
                    }]
                });

                if (canvasId === 'emailDonut') { emailChart = chart; }
                else if (canvasId === 'companyDonut') { companyChart = chart; }
                else if (canvasId === 'stromDonut') { stromChart = chart; }
                else if (canvasId === 'gasDonut') { gasChart = chart; }
            }

            loadStats();
        }

        document.addEventListener('DOMContentLoaded', initStats);
    </script>

    <script src="main.js"></script>
</body>
</html>
