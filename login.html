<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Vertrauen Distributor</title>
    <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone.ico" />
    <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone.ico" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Styles spécifiques pour la page login - COULEURS HOMOGENES */
        .btn-login {
            background-color: #54e50d !important;
            color: #0c2545 !important;
            border: none !important;
            padding: 10px 32px !important;
            font-size: 1rem !important;
            font-weight: 700 !important;
            border-radius: 30px !important;
            cursor: pointer !important;
            transition: all 0.25s ease !important;
            letter-spacing: 0.5px !important;
            text-transform: uppercase !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15) !important;
            text-decoration: none !important;
            display: inline-block !important;
        }
        .btn-login:hover {
            background-color: #6a7b91 !important;
            color: #ffffff !important;
            transform: scale(1.04) !important;
            box-shadow: 0 4px 16px rgba(106, 123, 145, 0.3) !important;
        }
        .btn-login:active {
            transform: scale(0.96) !important;
        }

        .btn-forgot {
            color: #0c2545 !important;
            text-decoration: none !important;
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            transition: color 0.2s !important;
        }
        .btn-forgot:hover {
            color: #54e50d !important;
            text-decoration: underline !important;
        }

        .btn-back {
            color: #ffffff !important;
            background-color: #6a7b91 !important;
            text-decoration: none !important;
            font-weight: 600 !important;
            padding: 10px 20px !important;
            border: none !important;
            border-radius: 30px !important;
            transition: all 0.25s ease !important;
            display: inline-block !important;
            font-size: 0.9rem !important;
        }
        .btn-back:hover {
            background-color: #4a5b71 !important;
            color: #ffffff !important;
            transform: scale(1.04) !important;
        }

        .register-link {
            color: #54e50d !important;
            text-decoration: none !important;
            font-weight: 600 !important;
            transition: color 0.2s !important;
        }
        .register-link:hover {
            color: #0c2545 !important;
            text-decoration: underline !important;
        }

        .login-card .form-control {
            background-color: rgba(255, 255, 255, 0.7) !important;
            border: 1px solid rgba(12, 37, 69, 0.2) !important;
            color: #222 !important;
        }
        .login-card .form-control:focus {
            border-color: #54e50d !important;
            box-shadow: 0 0 0 3px rgba(84, 229, 13, 0.25) !important;
        }

        .login-card label {
            color: #0c2545 !important;
            font-weight: 600 !important;
        }

        .login-card h3 {
            color: #0c2545 !important;
        }

        .login-card p {
            color: #333 !important;
        }

        .login-card .text-right {
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            gap: 16px !important;
            flex-wrap: wrap !important;
        }

        #forgot-form-container .text-right {
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            gap: 12px !important;
            flex-wrap: wrap !important;
        }

        .top-bar {
            background-color: #0c2545 !important;
            padding: 12px 48px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            max-width: 820px !important;
            border-radius: 12px !important;
            margin: 0 auto 24px auto !important;
            box-shadow: 0 4px 20px rgba(12, 37, 69, 0.3) !important;
        }
        .top-bar span {
            color: #ffffff !important;
            font-weight: 600 !important;
            font-size: 1.1rem !important;
        }
        .top-bar span .fa {
            color: #54e50d !important;
            margin-right: 8px !important;
        }

        .impressum-card {
            background-color: rgba(200, 200, 200, 0.30) !important;
            border: 1px solid rgba(12, 37, 69, 0.2) !important;
            border-radius: 16px !important;
            padding: 40px 48px !important;
            width: 100% !important;
            max-width: 820px !important;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1) !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
        }
        .impressum-card:hover {
            border-color: #54e50d !important;
            box-shadow: 0 8px 50px rgba(84, 229, 13, 0.15) !important;
        }

        #registration-form-container {
            border-top: 1px solid rgba(12, 37, 69, 0.2) !important;
        }

        .input-with-icon .icon {
            color: #54e50d !important;
        }

        @media (max-width: 700px) {
            .top-bar {
                padding: 10px 24px !important;
            }
            .impressum-card {
                padding: 28px 22px !important;
            }
            .btn-login {
                padding: 8px 22px !important;
                font-size: 0.9rem !important;
            }
        }
        @media (max-width: 450px) {
            .top-bar {
                padding: 8px 16px !important;
            }
            .btn-login {
                padding: 6px 18px !important;
                font-size: 0.8rem !important;
            }
            .impressum-card {
                padding: 20px 16px !important;
            }
            .login-card .text-right {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            #forgot-form-container .text-right {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .login-card .btn-forgot {
                text-align: center !important;
            }
            .btn-back {
                text-align: center !important;
            }
        }
    </style>
</head>
<body class="login-page">
    <main class="main-content">
        <div class="logo-wrapper">
            <a href="index.html">
                <img src="Images/Vertrauen_Logo1.png" alt="Vertrauen Distributor" />
            </a>
        </div>
        <div class="top-bar">
            <span>
                <span class="fa fa-unlock-alt"></span> Portalanmeldung
            </span>
        </div>

        <section class="impressum-card login-card">
            <!-- 1. CONNEXION -->
            <div id="login-form-container">
                <form id="login-form" action="#" method="post">
                    <div class="form-group">
                        <label for="user">Benutzername (E‑Mail)</label>
                        <input type="email" id="user" name="user" placeholder="E-Mail" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="pass">Passwort</label>
                        <input type="password" id="pass" name="pass" placeholder="Passwort" class="form-control" required />
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn-login">Anmelden</button>
                        <a href="#" class="btn-forgot" id="forgot-link">Passwort vergessen?</a>
                    </div>
                    <div id="login-message" style="margin-top: 10px; font-weight: 500;"></div>
                </form>
                <p style="margin-top: 20px; text-align: center; color: #666;">
                    Noch kein Vertriebspartner? 
                    <a href="#" id="show-registration-link" class="register-link">
                        Jetzt registrieren
                    </a>
                </p>
            </div>

            <!-- 2. INSCRIPTION -->
            <div id="registration-form-container" style="display: none; margin-top: 30px; padding-top: 20px;">
                <h3 style="margin-bottom: 20px;">Registrierung</h3>
                <form id="registration-form" action="#" method="post">
                    <div class="form-group">
                        <label for="anrede">Anrede</label>
                        <select id="anrede" name="anrede" class="form-control">
                            <option value="Herr">Herr</option>
                            <option value="Frau">Frau</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vorname">Vorname</label>
                        <input type="text" id="vorname" name="vorname" placeholder="Vorname" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label for="nachname">Nachname</label>
                        <input type="text" id="nachname" name="nachname" placeholder="Nachname" class="form-control" />
                    </div>
                    <div class="form-group">
                        <label for="tel_vorwahl">Telefon (Festnetz)</label>
                        <div class="input-with-icon">
                            <i class="fas fa-phone icon"></i>
                            <div style="display: flex; gap: 10px; width: 100%;">
                                <input type="text" id="tel_vorwahl" name="tel_vorwahl" placeholder="Vorwahl" class="form-control icon-input" style="flex:1;" />
                                <input type="text" id="tel_nummer" name="tel_nummer" placeholder="Rufnummer" class="form-control icon-input" style="flex:2;" />
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="fax_vorwahl">Fax</label>
                        <div class="input-with-icon">
                            <i class="fas fa-fax icon"></i>
                            <div style="display: flex; gap: 10px; width: 100%;">
                                <input type="text" id="fax_vorwahl" name="fax_vorwahl" placeholder="Vorwahl" class="form-control icon-input" style="flex:1;" />
                                <input type="text" id="fax_nummer" name="fax_nummer" placeholder="Rufnummer" class="form-control icon-input" style="flex:2;" />
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">E-Mail</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope icon"></i>
                            <input type="email" id="email" name="email" placeholder="E-Mail" class="form-control icon-input" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email_wdh">E-Mail wdh.</label>
                        <input type="email" id="email_wdh" name="email_wdh" placeholder="E-Mail wiederholen" class="form-control" />
                    </div>

                    <div id="password-fields" style="display: none;">
                        <div class="form-group">
                            <label for="reg-password">Passwort</label>
                            <input type="password" id="reg-password" name="reg-password" placeholder="Passwort" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label for="reg-password-confirm">Passwort bestätigen</label>
                            <input type="password" id="reg-password-confirm" name="reg-password-confirm" placeholder="Passwort wiederholen" class="form-control" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 10px; color: #0c2545; cursor: pointer; font-weight: 500;">
                            <input type="checkbox" id="datenschutz" name="datenschutz" value="1" required />
                            Ich habe die Datenschutzbestimmungen verstanden und akzeptiert
                        </label>
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn-login" id="register-btn">Registrieren</button>
                        <a href="#" id="hide-registration-link" class="btn-forgot" style="font-size: 0.9rem;">Abbrechen</a>
                    </div>
                    <div id="register-message" style="margin-top: 10px; font-weight: 500;"></div>
                </form>
            </div>

            <!-- 3. PASSWORT VERGESSEN -->
            <div id="forgot-form-container" style="display: none; margin-top: 20px;">
                <h3 style="margin-bottom: 15px;">Passwort vergessen?</h3>
                <p style="margin-bottom: 20px;">
                    Bitte den Benutzernamen oder die E-Mail-Adresse eingeben. Sie erhalten dann umgehend Anweisungen zum Zurücksetzen des Passworts zugesandt.
                </p>
                <form id="forgot-form" action="#" method="post">
                    <div class="form-group">
                        <label for="forgot-username">Benutzername oder E-Mail-Adresse:</label>
                        <input type="text" id="forgot-username" name="forgot-username" placeholder="Benutzername oder E-Mail" class="form-control" />
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn-login">Anmelden</button>
                        <a href="#" id="back-to-login-link" class="btn-back">Zurück</a>
                    </div>
                    <div id="forgot-message" style="margin-top: 10px; font-weight: 500;"></div>
                </form>
            </div>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="main.js"></script>
</body>
</html>
