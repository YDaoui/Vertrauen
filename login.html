<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Vertrauen Distributor</title>
    <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone1.ico" />
    <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone1.ico" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="login-page">
    <main class="main-content">
        <div class="logo-wrapper">
            <a href="index.html">
                <img src="Images/Vertrauen_Logo1.png" alt="Vertrauen Distributor" />
            </a>
        </div>
        <div class="top-bar">
            <span>
                <span class="fa fa-unlock-alt"></span> Portalanmeldung
            </span>
        </div>

        <section class="impressum-card login-card">
            <!-- 1. CONNEXION -->
            <div id="login-form-container">
                <form id="login-form" action="#" method="post">
                    <div class="form-group">
                        <label for="user">Benutzername (E‑Mail)</label>
                        <input type="email" id="user" name="user" placeholder="E-Mail" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label for="pass">Passwort</label>
                        <input type="password" id="pass" name="pass" placeholder="Passwort" class="form-control" required />
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn-login">Anmelden</button>
                        <a href="#" class="btn-forgot" id="forgot-link">Passwort vergessen?</a>
                    </div>
                    <div id="login-message" style="margin-top: 10px; font-weight: 500;"></div>
                </form>
            </div>

            <!-- 3. PASSWORT VERGESSEN -->
            <div id="forgot-form-container" style="display: none; margin-top: 20px;">
                <h3 style="margin-bottom: 15px; color: #012a6b;">Passwort vergessen?</h3>
                <p style="margin-bottom: 20px; color: #333;">
                    Bitte den Benutzernamen oder die E-Mail-Adresse eingeben. Sie erhalten dann umgehend Anweisungen zum Zurücksetzen des Passworts zugesandt.
                </p>
                <form id="forgot-form" action="#" method="post">
                    <div class="form-group">
                        <label for="forgot-username">Benutzername oder E-Mail-Adresse:</label>
                        <input type="text" id="forgot-username" name="forgot-username" placeholder="Benutzername oder E-Mail" class="form-control" />
                    </div>
                    <div class="form-group text-right">
                        <button type="submit" class="btn-login">Anmelden</button>
                        <a href="#" id="back-to-login-link" class="btn-back">Zurück</a>
                    </div>
                    <div id="forgot-message" style="margin-top: 10px; font-weight: 500;"></div>
                </form>
            </div>
        </section>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="main.js"></script>

    <!-- ============================================================
         DÉSACTIVATION DU CHAT TAWK.TO SUR LA PAGE LOGIN
         ============================================================ -->
    <script>
    (function () {
        // 1. Neutralise les fonctions d'init du chat
        function killChat() {
            window.initTawkTo = function () {};
            window.initChatOnAllPages = function () {};

            // Supprime tout script Tawk déjà injecté
            document.querySelectorAll('script[src*="embed.tawk.to"]').forEach(s => s.remove());
        }

        // Exécution immédiate (avant que DOMContentLoaded ne soit traité)
        killChat();
        setTimeout(killChat, 0);
        setTimeout(killChat, 100);

        // 2. Filet de sécurité : supprime tout widget Tawk qui apparaîtrait
        function removeTawkWidgets() {
            var selectors = [
                'iframe[src*="tawk.to"]',
                'div[class*="tawk"]',
                'div[id*="tawk"]',
                '.widget-visible',
                '#tawkchat-minified-container',
                '.tawk-min-container'
            ];
            selectors.forEach(function (sel) {
                document.querySelectorAll(sel).forEach(function (el) {
                    el.remove();
                });
            });
        }

        window.addEventListener('DOMContentLoaded', function () {
            removeTawkWidgets();
            setTimeout(removeTawkWidgets, 500);
            setTimeout(removeTawkWidgets, 1500);
            setTimeout(removeTawkWidgets, 3000);

            // Surveillance continue (au cas où il serait réinjecté)
            var observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    m.addedNodes.forEach(function (node) {
                        if (node.nodeType !== 1) return;
                        var id = (node.id || '') + ' ' + (node.className || '');
                        if (/tawk/i.test(id) ||
                            (node.tagName === 'IFRAME' && /tawk\.to/i.test(node.src || ''))) {
                            node.remove();
                        }
                    });
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });

        window.addEventListener('load', function () {
            removeTawkWidgets();
            setTimeout(removeTawkWidgets, 1000);
        });
    })();
    </script>
</body>
</html>
