<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willkommen – Vertrauen Distributor</title>
    <link rel="icon" type="image/x-icon" href="Images/Icones/Vertrauen_Icone1.ico" />
    <link rel="shortcut icon" href="Images/Icone/Vertrauen_Icone1.ico" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EV3MLGBFYW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-EV3MLGBFYW');
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
    <header class="dashboard-header">
        <!-- Logo à gauche -->
        <a href="index.html" class="logo-link">
            <img src="Images/Vertrauen_Logo1.png" alt="Vertrauen Distributor" />
        </a>

        <!-- Message de bienvenue centré -->
        <span id="userNameDisplay" class="welcome-center"></span>

        <!-- Hamburger (visible sur mobile) -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Menü öffnen/schließen">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation -->
        <nav class="dashboard-nav" id="mainNav">
            <!-- Menu pour tous -->
            <a href="dashboard.html" class="active">Willkommen</a>
            
            <!-- Lien Statistik pour ADMIN (daoui00yassine@gmail.com) -->
            <a href="stat.html" id="statLink" style="display:none;">Statistik</a>
            
            <!-- Lien Mein Portal pour UTILISATEURS NORMALUX -->
            <a href="mein-portal.html" id="portalLink">Mein Portal</a>
            
            <a href="company.html">Company</a>
            <a href="ueber-uns.html">Über uns</a>
            <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
            <a href="#" id="logoutMobile" style="display:none;">Abmelden</a>
        </nav>

     
    </header>

    <main class="dashboard-content">
        <div class="willkommen-box">
            <h1 id="welcomeTitle">Willkommen im Dashboard!</h1>
            <p id="welcomeMessage">
                Hier finden Sie alle wichtigen Informationen auf einen Blick.<br />
                Nutzen Sie das Menü oben, um zu navigieren.
            </p>
        </div>
    </main>

    <footer class="dashboard-footer">
        <a href="datenschutz.html">Datenschutzerklärung</a>
        <span style="color:#aaa; margin:0 12px;">|</span>
        <span style="color:#888;">© 2026 Vertrauen Distributor Vertriebs GmbH</span>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userEmail = localStorage.getItem('userEmail');
            
            const statLink = document.getElementById('statLink');
            const portalLink = document.getElementById('portalLink');
            const adminLink = document.getElementById('adminLink');
            
            if (userEmail === 'daoui00yassine@gmail.com') {
                // ADMIN : afficher Statistik et Admin, cacher Mein Portal
                if (statLink) statLink.style.display = 'inline-block';
                if (portalLink) portalLink.style.display = 'none';
                if (adminLink) adminLink.style.display = 'inline-block';
            } else {
                // UTILISATEUR NORMAL : afficher Mein Portal, cacher Statistik et Admin
                if (statLink) statLink.style.display = 'none';
                if (portalLink) portalLink.style.display = 'inline-block';
                if (adminLink) adminLink.style.display = 'none';
            }
        });
    </script>

    <!-- Toute la logique (auth, affichage du nom, etc.) vit dans main.js -->
    <script src="main.js"></script>
</body>
</html>
