            <form class="vp-form" action="#" method="POST">

                <!-- Firma -->
                <div class="form-group">
                    <label for="firma">Firma</label>
                    <input type="text" id="firma" name="firma" class="form-control" placeholder="Ihre Firma" />
                </div>

                <!-- Land (Radio) -->
                <div class="form-group">
                    <label>Bitte wählen Sie ein Land aus <span class="required">*</span></label>

                        <label><input type="radio" name="land" value="Österreich" /> Österreich</label>
                        <label><input type="radio" name="land" value="Schweiz" /> Schweiz</label>
                        <label><input type="radio" name="land" value="andere" /> andere</label>
                    </div>
                </div>

                <!-- PLZ -->
                <div class="form-group">
                    <label for="plz">PLZ <span class="required">*</span></label>
                    <input type="text" id="plz" name="plz" class="form-control" placeholder="Ihre Postleitzahl" required />
                </div>

                <!-- Vorname / Nachname -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="vorname">Vorname <span class="required">*</span></label>
                        <input type="text" id="vorname" name="vorname" class="form-control" placeholder="Ihr Vorname" required />
                    </div>
                    <div class="form-group">
                        <label for="nachname">Nachname <span class="required">*</span></label>
                        <input type="text" id="nachname" name="nachname" class="form-control" placeholder="Ihr Nachname" required />
                    </div>
                </div>

                <!-- E-Mail -->
                <div class="form-group">
                    <label for="email">E-Mail-Adresse <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="ihre@email.de" required />
                </div>

                <!-- Telefon -->
                <div class="form-group">
                    <label for="telefon">Telefonnummer <span class="required">*</span></label>
                    <input type="tel" id="telefon" name="telefon" class="form-control" placeholder="+49 123 456789" required />
                </div>

                <!-- Interessen (Checkboxen) -->
                <div class="form-group">
                    <label>Ich interessiere mich für... <span class="required">*</span></label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="interesse" value="Strom/Gas" /> Strom/Gas</label>
                        <label><input type="checkbox" name="interesse" value="Gewerbe (SLP, RLM)" /> Gewerbe (SLP, RLM)</label>
                        <label><input type="checkbox" name="interesse" value="Telekommunikation" /> Telekommunikation</label>
                        <label><input type="checkbox" name="interesse" value="Glasfaser" /> Glasfaser</label>
                    </div>
                </div>

                <!-- Nachricht -->

                    <label for="nachricht">Hier können Sie uns eine Nachricht hinterlassen.</label>
                    <textarea id="nachricht" name="nachricht" class="form-control textarea-lg" placeholder="Ihre Nachricht an uns..."></textarea>

                <!-- Datenschutz Checkbox -->

                        </label>
                    </div>
                </div>

<script>
    // ===== SCROLL : CACHER BANDEAU SOCIAL + CHANGER COULEUR HEADER =====
    (function() {
        function applyScroll() {
            const socialBar = document.querySelector('.social-top-bar');
            const header = document.querySelector('.dashboard-header');
            const body = document.body;
            const scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop;

            if (scrollY > 50) {
                if (socialBar) socialBar.classList.add('hidden');
                if (header) {
                    header.classList.add('scrolled');
                    header.classList.add('top-zero');
                }
                if (body) body.classList.add('scrolled-page');
            } else {
                if (socialBar) socialBar.classList.remove('hidden');
                if (header) {
                    header.classList.remove('scrolled');
                    header.classList.remove('top-zero');
                }
                if (body) body.classList.remove('scrolled-page');
            }
        }
        window.addEventListener('scroll', applyScroll, { passive: true });
        document.addEventListener('DOMContentLoaded', applyScroll);
        applyScroll();
    })();
</script>
<script>
    // ===== MENU HAMBURGER =====
    (function() {
        function initHamburger() {
            const hamburger = document.getElementById('hamburgerBtn');
            const nav = document.getElementById('mainNav');

            if (!hamburger || !nav) {
                setTimeout(initHamburger, 200);
                return;
            }

            // Supprimer les anciens listeners en clonant
            const newHamburger = hamburger.cloneNode(true);
            hamburger.parentNode.replaceChild(newHamburger, hamburger);

            const finalHamburger = document.getElementById('hamburgerBtn');
            const finalNav = document.getElementById('mainNav');

            if (!finalHamburger || !finalNav) return;

            finalHamburger.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                finalNav.classList.toggle('open');
            });

            // Fermer le menu si on clique sur un lien
            finalNav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function() {
                    if (finalNav.classList.contains('open')) {
                        finalHamburger.classList.remove('active');
                        finalNav.classList.remove('open');
                    }
                });
            });

            // Fermer le menu si on clique ailleurs
            document.addEventListener('click', function(e) {
                if (finalNav.classList.contains('open')) {
                    if (!finalNav.contains(e.target) && !finalHamburger.contains(e.target)) {
                        finalHamburger.classList.remove('active');
                        finalNav.classList.remove('open');
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initHamburger);
        initHamburger();
    })();
</script>
